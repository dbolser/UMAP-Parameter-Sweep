<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMAP Parameter Exploration Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            margin: 0 auto;
        }

        header {
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 10px;
            padding: 20px 25px;
            margin: 0 auto 30px;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .matrix-wrap {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        table.matrix {
            border-collapse: collapse;
            margin: 0 auto;
        }

        .matrix th {
            color: #333;
            font-size: 0.9em;
            font-weight: 600;
            padding: 6px;
            white-space: nowrap;
        }

        .matrix .axis {
            color: #667eea;
        }

        .matrix td {
            padding: 2px;
        }

        .matrix img {
            display: block;
            width: 100%;
            min-width: 120px;
            aspect-ratio: 1;
            object-fit: contain;
            background: #f5f5f5;
        }

        .matrix td.missing {
            background: #fafafa;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
            font-size: 0.9em;
        }

        footer a {
            color: white;
        }
    </style>
</head>

res/400/umap-0200-0.25000-euclidean.png", "n_neighbors": "0200", "min_dist": "0.25000", "metric": "euclidean"}, {"filename": "umap-0200-0.50000-cosine.png", "path": "Figures/400/umap-0200-0.50000-cosine.png", "n_neighbors": "0200", "min_dist": "0.50000", "metric": "cosine"}, {"filename": "umap-0200-0.50000-euclidean.png", "path": "Figures/400/umap-0200-0.50000-euclidean.png", "n_neighbors": "0200", "min_dist": "0.50000", "metric": "euclidean"}, {"filename": "umap-0200-0.99000-cosine.png", "path": "Figures/400/umap-0200-0.99000-cosine.png", "n_neighbors": "0200", "min_dist": "0.99000", "metric": "cosine"}, {"filename": "umap-0200-0.99000-euclidean.png", "path": "Figures/400/umap-0200-0.99000-euclidean.png", "n_neighbors": "0200", "min_dist": "0.99000", "metric": "euclidean"}]};
        const DEFAULT_SIZE = '8000';
        const DEFAULT_METRIC = 'cosine';

        const uniqueSorted = (values) => [...new Set(values)].sort((a, b) => parseFloat(a) - parseFloat(b) || a.localeCompare(b));
        const allFigures = Object.entries(figuresBySize).flatMap(([size, figs]) => figs.map(f => ({...f, size})));

        const sizeFilter = document.getElementById('sizeFilter');
        const metricFilter = document.getElementById('metricFilter');

        function fillSelect(select, values, preferred) {
            values.forEach(v => select.add(new Option(v, v)));
            if (values.includes(preferred)) select.value = preferred;
        }

        fillSelect(sizeFilter, uniqueSorted(allFigures.map(f => f.size)), DEFAULT_SIZE);
        fillSelect(metricFilter, uniqueSorted(allFigures.map(f => f.metric)), DEFAULT_METRIC);

        function updateMatrix() {
            const figs = allFigures.filter(f => f.size === sizeFilter.value && f.metric === metricFilter.value);
            const rows = uniqueSorted(figs.map(f => f.n_neighbors));
            const cols = uniqueSorted(figs.map(f => f.min_dist));
            const lookup = new Map(figs.map(f => [`${f.n_neighbors}|${f.min_dist}`, f]));

            const header = `<tr><th class="axis">n_neighbors \\ min_dist</th>${cols.map(c => `<th>${parseFloat(c)}</th>`).join('')}</tr>`;
            const body = rows.map(r => `<tr><th>${parseInt(r, 10)}</th>${cols.map(c => {
                const f = lookup.get(`${r}|${c}`);
                return f
                    ? `<td><a href="${f.path}" target="_blank"><img src="${f.path}" alt="n_neighbors=${parseInt(r, 10)}, min_dist=${parseFloat(c)}" title="n_neighbors=${parseInt(r, 10)}, min_dist=${parseFloat(c)}" loading="lazy"></a></td>`
                    : '<td class="missing"></td>';
            }).join('')}</tr>`).join('');

            document.getElementById('matrix').innerHTML = header + body;
        }

        sizeFilter.addEventListener('change', updateMatrix);
        metricFilter.addEventListener('change', updateMatrix);

        updateMatrix();
    </script>
